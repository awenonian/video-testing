<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Star Theater</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15121a; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Preview renderer for out/star-theater.bin (written by model/build.mjs).
// window.view(az, el, dist, tx, ty) positions the camera; window.mode(m) switches
// between 'painted' and 'grey' (unpainted print) looks.
import * as THREE from 'three';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const GROUPS = ['stone', 'mortar', 'trim', 'wood', 'glass', 'gold', 'marquee', 'bulb', 'paper', 'ink', 'iron'];
const PAINT = {
  stone:   { color: 0xc7ab8a, roughness: 0.9 },
  mortar:  { color: 0x8a735c, roughness: 1 },
  trim:    { color: 0xe9dcc2, roughness: 0.8 },
  wood:    { color: 0x5b1a2b, roughness: 0.6 },
  glass:   { color: 0x1f2233, roughness: 0.25, metalness: 0.2, emissive: 0x3a2410, emissiveIntensity: 0.6 },
  gold:    { color: 0xd2a54a, roughness: 0.35, metalness: 0.85 },
  marquee: { color: 0x3c1a45, roughness: 0.6 },
  bulb:    { color: 0xfff1c0, roughness: 0.3, emissive: 0xffc860, emissiveIntensity: 1.6 },
  paper:   { color: 0xe8d6a8, roughness: 0.95 },
  ink:     { color: 0x8e2438, roughness: 0.9 },
  iron:    { color: 0x2b2a2e, roughness: 0.5, metalness: 0.7 },
};

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15121a);
const camera = new THREE.PerspectiveCamera(30, W / H, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 105, 0);

scene.add(new THREE.HemisphereLight(0xc8d4ff, 0x3a2a20, 0.9));
const key = new THREE.DirectionalLight(0xfff0dc, 2.4);
key.position.set(-160, 260, 320);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
Object.assign(key.shadow.camera, { left: -160, right: 160, top: 260, bottom: -40, near: 10, far: 1200 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.3;
scene.add(key);
const fill = new THREE.DirectionalLight(0x9fb4ff, 0.7);
fill.position.set(220, 80, 200);
scene.add(fill);
const warm = new THREE.PointLight(0xffb45a, 4000, 160, 1.6);   // glow of the marquee on the street
warm.position.set(0, 50, 60);
scene.add(warm);

// table / street
const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshStandardMaterial({ color: 0x3b3530, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const buf = await (await fetch('/out/star-theater.bin')).arrayBuffer();
const [nv, nt] = new Uint32Array(buf, 0, 2);
const pos = new Float32Array(buf, 8, nv * 3);
const idx = new Uint32Array(buf, 8 + nv * 12, nt * 3);
const grp = new Uint8Array(buf, 8 + nv * 12 + nt * 12, nt);

const painted = {}, grey = new THREE.MeshStandardMaterial({ color: 0x9a9690, roughness: 0.75 });
const meshes = [];
const model = new THREE.Group();
for (let g = 0; g < GROUPS.length; g++) {
  const tris = [];
  for (let t = 0; t < nt; t++) if (grp[t] === g) tris.push(idx[t * 3], idx[t * 3 + 1], idx[t * 3 + 2]);
  if (!tris.length) continue;
  const p = new Float32Array(tris.length * 3);
  tris.forEach((v, i) => p.set(pos.subarray(v * 3, v * 3 + 3), i * 3));
  let geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
  geo = toCreasedNormals(geo, Math.PI / 5);
  painted[g] = new THREE.MeshStandardMaterial(PAINT[GROUPS[g]]);
  const m = new THREE.Mesh(geo, painted[g]);
  m.castShadow = m.receiveShadow = true;
  m.userData.g = g;
  meshes.push(m);
  model.add(m);
}
// The file is in print orientation (back on z=0). Stand it up: y is already the height axis.
model.position.z = -8;
scene.add(model);

window.mode = m => { for (const x of meshes) x.material = m === 'grey' ? grey : painted[x.userData.g]; warm.visible = m !== 'grey'; };
window.view = (az = 0, el = 8, dist = 520, tx = 0, ty = 105) => {
  const a = az * Math.PI / 180, e = el * Math.PI / 180;
  controls.target.set(tx, ty, 0);
  camera.position.set(tx + dist * Math.sin(a) * Math.cos(e), ty + dist * Math.sin(e), dist * Math.cos(a) * Math.cos(e));
  camera.lookAt(controls.target);
  renderer.render(scene, camera);
};
window.renderAt = t => view(-35 + 70 * (0.5 - 0.5 * Math.cos(t * 2 * Math.PI)), 10 + 8 * Math.sin(t * 2 * Math.PI), 560);
view();
controls.addEventListener('change', () => renderer.render(scene, camera));
window.ready = true;
</script>
</body>
</html>
